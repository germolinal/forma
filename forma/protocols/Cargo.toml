[package]
name = "protocols"
version = "0.2.3"
edition = "2024"
publish = false
license = "MIT"

[features]
integration_test = []
# OpenAPI schemas for the types that travel over Forma's HTTP APIs.
openapi = ["dep:utoipa", "genai_client/openapi"]

[dependencies]
chrono = { workspace = true }
http = { workspace = true }
genai_client = { path = "../genai_client" }
serde = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
ring = "0.17"
base64 = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
