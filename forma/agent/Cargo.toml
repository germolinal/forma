[package]
name = "agent"
version = "0.2.4"
edition = "2024"
publish = false
license = "MIT"

[features]
integration_test = []
airtight = []

[dependencies]
db = { path = "../db" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
protocols = { path = "../protocols" }
genai_client = { path = "../genai_client" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
derive = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
# Decodes a fetched page in the charset it names, as reqwest's `text()` does.
encoding_rs = "0.8"
http = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
google-cloud-auth = { version = "1.17", default-features = false, features = [
    "default-rustls-provider",
] }
url = "2.5"
sha2 = "0.11"
scraper = "0.29"
htmd = "0.5"

[dev-dependencies]
tracing-subscriber = "0.3"
