# Uses Google Cloud Build to build a Docker image
# that will be used as the runtime for the CLI.
#
# References Dockerfile.cli
substitutions:
  _REGION: europe-west2
  _PROJECT_ID: enterprise-template
  _DOCKER_REPO: forma-agent-tests-enterprise-forma-repo
  _IMAGE_NAME: forma-cli
  _TAG: latest
  _BUILD_SA_ID: cloud-build-sa

serviceAccount: 'projects/${_PROJECT_ID}/serviceAccounts/${_BUILD_SA_ID}@${_PROJECT_ID}.iam.gserviceaccount.com'
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_DOCKER_REPO}/${_IMAGE_NAME}:${_TAG}'
      - '-f'
      - 'Dockerfile.cli'
      - '.'
images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_DOCKER_REPO}/${_IMAGE_NAME}:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
