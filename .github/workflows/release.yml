# Releases Forma: a v* tag publishes the CLI's binaries (a GitHub Release) and
# the images (GitHub Container Registry). The website and the docs are
# published by pages.yml, from the same tag.
#
# The tag is the version: `v0.9.18` needs `version = "0.9.18"` in
# forma/Cargo.toml, which is what `forma --version` reports. A tag with a
# suffix (`v1.0.0-rc.1`) is a prerelease: no `latest`, anywhere.
#
# Everything builds on native runners, one per architecture: emulating arm64
# makes a Rust build take hours.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' forma/Cargo.toml | head -n 1)
          if [ "$version" != "$crate" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but forma/Cargo.toml says $crate: bump it, and tag that commit"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # ── The CLI's binaries ────────────────────────────────────────────────────
  binaries:
    name: CLI (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner: the binary needs the glibc it was built
          # against (2.35), or newer.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: forma
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin forma --target ${{ matrix.target }}
      - name: Check it runs
        run: |
          out=$("target/${{ matrix.target }}/release/forma" --version)
          echo "$out"
          [ "$out" = "forma ${{ needs.version.outputs.version }}" ]
      # No version in the name, so that the latest release has a stable
      # address: .../releases/latest/download/forma-<target>.tar.gz
      - name: Package
        run: |
          name="forma-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/forma" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: forma/dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  # ── Images ────────────────────────────────────────────────────────────────
  # Each image, for each architecture, pushed by digest; `manifests` then joins
  # the two architectures under the version's tags.
  images:
    name: Image ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image:
          # A single-tenant server: one agent, read from a file.
          - { name: forma, file: Dockerfile.channel, features: "" }
          # Many agents, read from the database: for platforms.
          - { name: forma-multi-tenant, file: Dockerfile.channel, features: multi-tenant }
          - { name: forma-manager, file: Dockerfile.manager, features: "" }
          # The CLI, for pipelines (e.g., `forma eval` in CI).
          - { name: forma-cli, file: Dockerfile.cli, features: "" }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: forma
          file: forma/${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ matrix.image.features != '' && format('FEATURES={0}', matrix.image.features) || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Publish ${{ matrix.image }}
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signing
    strategy:
      fail-fast: false
      matrix:
        image: [forma, forma-multi-tenant, forma-manager, forma-cli]
    env:
      # Job-level env cannot read the workflow's (IMAGE_PREFIX).
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 0.9.18, 0.9 and latest; a prerelease gets only its own version.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ needs.version.outputs.prerelease == 'false' }}
      - name: Join the architectures
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
      - id: digest
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      # Keyless: the signature says this workflow, in this repository, built
      # the image. It is recorded in a public transparency log (Rekor), which
      # would name a private repository: only once Forma is public.
      - if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@v3
      - if: ${{ !github.event.repository.private }}
        name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"
